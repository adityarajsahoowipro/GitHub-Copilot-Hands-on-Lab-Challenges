{% extends "base.html" %}

{% block content %}
<h1>New incident</h1>

{% if errors %}
<div class="alert alert-error">
  <strong>Please fix the following:</strong>
  <ul>
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
</div>
{% endif %}

<form class="form" method="post" action="/incidents/new">
  <div class="field">
    <label for="title">Title *</label>
    <input id="title" name="title" value="{{ form.title or '' }}" placeholder="Checkout service unavailable">
  </div>

  <div class="field">
    <label for="severity">Severity *</label>
    <select id="severity" name="severity">
      <option value="">Select severity…</option>
      {% for severity in severities %}
      <option value="{{ severity.value }}" {% if form.severity == severity.value %}selected{% endif %}>
        {{ severity.value }} — {{ severity.label }}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label for="impactedService">Impacted service *</label>
    <input id="impactedService" name="impactedService" value="{{ form.impactedService or '' }}" placeholder="Checkout Service">
  </div>

  <div class="field">
    <label for="owner">Owner</label>
    <input id="owner" name="owner" value="{{ form.owner or '' }}" placeholder="Unassigned">
  </div>

  <div class="field">
    <label for="description">Description</label>
    <textarea id="description" name="description" placeholder="What is happening, and what is the observed impact?">{{ form.description or '' }}</textarea>
  </div>

  <div>
    <button class="btn" type="submit">Create incident</button>
    <a class="btn btn-secondary" href="/incidents">Cancel</a>
  </div>
</form>
{% endblock %}
